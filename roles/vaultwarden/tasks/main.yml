---

- name: Create application user group
  ansible.builtin.group:
    name: "{{ vaultwarden_group_name }}"
    state: present
    gid: "{{ vaultwarden_group_id | default(omit, boolean=True) }}"

- name: Create application user
  ansible.builtin.user:
    name: "{{ vaultwarden_user_name }}"
    password: "!"
    state: present
    uid: "{{ vaultwarden_user_id | default(omit, boolean=True) }}"
    group: "{{ vaultwarden_group_name }}"

- name: Create application directory
  ansible.builtin.file:
    state: directory
    group: "{{ vaultwarden_group_name }}"
    owner: "{{ vaultwarden_user_name }}"
    mode: "0755"
    path: "{{ item }}"
  loop:
    - "{{ vaultwarden_root_dir }}"
    - "{{ vaultwarden_root_dir }}/data"

- name: Copy application templates
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    owner: "{{ vaultwarden_user_name }}"
    group: "{{ vaultwarden_group_name }}"
    mode: "{{ item.mode }}"
  loop:
    - { src: ".env.j2", dest: "{{ vaultwarden_root_dir }}/.env", mode: "0600" }
    - { src: "docker-compose.yml.j2", dest: "{{ vaultwarden_root_dir }}/docker-compose.yml", mode: "0644" }

- name: Manage docker-compose stack state
  community.docker.docker_compose_v2:
    project_src: "{{ vaultwarden_root_dir }}"
    state: "{{ vaultwarden_stack_state }}"
    pull: "{{ 'always' if vaultwarden_stack_state == 'present' else 'missing' }}"
    remove_orphans: true
