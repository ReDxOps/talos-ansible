---

- name: Create application directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
    owner: "1000"
    group: "1000"
  loop:
    - "{{ ark_root_dir }}"
    - "{{ ark_root_dir }}/{{ ark_fjordur_name }}"
    - "{{ ark_root_dir }}/{{ ark_fjordur_backup_directory_name }}"
    - "{{ ark_root_dir }}/{{ ark_cluster_directory }}"

- name: Pull latest ARK Docker image
  community.docker.docker_image:
    name: "{{ ark_app_image }}:{{ ark_app_image_tag }}"
    source: pull
  register: ark_image_pull
  when: ark_stack_state == 'present'

- name: Copy docker-compose template
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ ark_root_dir }}/docker-compose.yml"
    mode: "0644"
  register: compose_file_status

- name: Track desired configuration state
  ansible.builtin.copy:
    content: "{{ {'user_settings': ark_game_user_settings, 'game_settings': ark_game_settings, 'custom_loots': ark_custom_loots} | to_nice_json }}"
    dest: "{{ ark_root_dir }}/.ark_config_state.json"
    owner: "1000"
    group: "1000"
    mode: "0644"
  register: ark_config_state
  notify:
    - Modify GameUserSettings.ini
    - Modify Game.ini
    - Modify Custom Loots in Game.ini (blockinfile)

- name: Determine if server shutdown is required
  ansible.builtin.set_fact:
    ark_shutdown_required: "{{ compose_file_status.changed or ark_config_state.changed or (ark_image_pull.changed | default(false)) }}"

- name: Stop application stack cleanly
  community.docker.docker_compose_v2:
    project_src: "{{ ark_root_dir }}"
    state: stopped
    timeout: 300
  when: ark_shutdown_required

- name: Flush handlers to apply config while server is stopped
  ansible.builtin.meta: flush_handlers

- name: Manage docker-compose stack state
  community.docker.docker_compose_v2:
    project_src: "{{ ark_root_dir }}"
    state: "{{ ark_stack_state }}"
    pull: missing
    timeout: 300

- name: Planified restart every 4 hours
  ansible.builtin.cron:
    name: "Memory Purge ARK server"
    minute: "0"
    hour: "*/4"
    job: "cd {{ ark_root_dir }} && docker compose ps --services --filter status=running | grep -q '{{ ark_fjordur_name }}' && docker compose restart {{ ark_fjordur_name }} > /dev/null 2>&1"
    state: "{{ 'present' if ark_stack_state == 'present' else 'absent' }}"
