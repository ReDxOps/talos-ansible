---
- name: Check if Node.js is already installed
  ansible.builtin.command: node -v
  register: nodejs_installed
  changed_when: false
  failed_when: false

- name: Setup NodeSource repository and install Node.js
  when: nodejs_installed.rc != 0
  block:
    - name: Ensure repository prerequisites are installed
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - gnupg
        state: present
        update_cache: true

    - name: Download NodeSource setup script
      ansible.builtin.get_url:
        url: "https://deb.nodesource.com/setup_{{ ai_cli_tools_nodejs_version }}.x"
        dest: /tmp/nodesource_setup.sh
        mode: "0750"

    - name: Execute NodeSource setup script
      ansible.builtin.command: /tmp/nodesource_setup.sh
      changed_when: true

    - name: Install Node.js and npm via apt
      ansible.builtin.apt:
        name: nodejs
        state: present
        update_cache: true

    - name: Remove temporary NodeSource script
      ansible.builtin.file:
        path: /tmp/nodesource_setup.sh
        state: absent
