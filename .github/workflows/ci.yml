name: CI
run-name: CI & Security Checks for ${{ github.ref_name }}

permissions:
  contents: read

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  VAULT_PASS_DEV: ${{ secrets.VAULT_PASS_DEV }}
  VAULT_PASS_PROD: ${{ secrets.VAULT_PASS_PROD }}
  ANSIBLE_VAULT_IDENTITY_LIST: dev@${{ github.workspace }}/.vault_pass_dev.sh,prod@${{ github.workspace }}/.vault_pass_prod.sh
  ANSIBLE_FORCE_COLOR: "True"

jobs:
  quality-check:
    name: Quality & Syntax
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Prepare Vault Passwords & SSH Key
        run: |
          echo '#!/bin/bash' > .vault_pass_dev.sh
          echo 'echo "$VAULT_PASS_DEV"' >> .vault_pass_dev.sh
          echo '#!/bin/bash' > .vault_pass_prod.sh
          echo 'echo "$VAULT_PASS_PROD"' >> .vault_pass_prod.sh
          chmod +x .vault_pass_dev.sh .vault_pass_prod.sh
          mkdir -p ~/.ssh
          ssh-keygen -t ed25519 -C "ci@talos" -f ~/.ssh/id_ed25519 -N ""

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Ansible Core & Ansible Lint
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Cache Ansible Collections
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ./collections/ansible_collections
          key: ansible-collections-${{ hashFiles('requirements.yml') }}
          restore-keys: ansible-collections-

      - name: Cache Ansible Roles
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ./roles_external
          key: ansible-roles-${{ hashFiles('requirements.yml') }}
          restore-keys: ansible-roles-

      - name: Install Ansible Galaxy Dependencies
        run: |
          if [ -f requirements.yml ]; then
            ansible-galaxy role install -r requirements.yml --force
            ansible-galaxy collection install -r requirements.yml --force-with-deps
          fi

      - name: Ansible Lint (All Playbooks)
        run: ansible-lint site.yml playbooks/*.yml

      - name: Syntax Check (Master Playbook)
        run:
          ansible-playbook site.yml --syntax-check --vault-id dev@${{ github.workspace }}/.vault_pass_dev.sh --vault-id prod@${{
          github.workspace}}/.vault_pass_prod.sh -e "@inventories/dev/group_vars/all/vars.yml" -e "@inventories/dev/group_vars/all/secrets.yml"

      - name: Syntax Check (Bootstrap Playbook)
        run:
          ansible-playbook playbooks/00_bootstrap.yml --syntax-check --vault-id dev@${{ github.workspace }}/.vault_pass_dev.sh --vault-id prod@${{
          github.workspace}}/.vault_pass_prod.sh -e "@inventories/dev/group_vars/all/vars.yml" -e "@inventories/dev/group_vars/all/secrets.yml"

  secret-leaks-check:
    runs-on: ubuntu-latest
    name: Secret leaks scan with GitLeaks
    steps:
      - name: Checkout Repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  checkov-scan:
    runs-on: ubuntu-latest
    name: Run IaC Misconfiguration
    steps:
      - name: Checkout Repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Run Checkov Scan
        uses: bridgecrewio/checkov-action@fa9edf8f0a491c59a924ea6accd5bdcf07752cff
        with:
          framework: ansible,yaml,github_actions
          quiet: true

  summary:
    name: Generate Pipeline Summary
    needs: [quality-check, secret-leaks-check, checkov-scan]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Write Summary
        run: |
          echo "### 📊 Rapport de CI/CD" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Statut |" >> $GITHUB_STEP_SUMMARY
          echo "| --- | --- |" >> $GITHUB_STEP_SUMMARY

          if [ "${{ needs.quality-check.result }}" = "success" ]; then
            echo "| Quality & Syntax | ✅ Success |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Quality & Syntax | ❌ Failed |" >> $GITHUB_STEP_SUMMARY
          fi

          if [ "${{ needs.secret-leaks-check.result }}" = "success" ]; then
            echo "| Secret Leaks Scan | ✅ Success |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Secret Leaks Scan | ❌ Failed |" >> $GITHUB_STEP_SUMMARY
          fi

          if [ "${{ needs.checkov-scan.result }}" = "success" ]; then
            echo "| IaC Misconfiguration | ✅ Success |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| IaC Misconfiguration | ❌ Failed |" >> $GITHUB_STEP_SUMMARY
          fi
